      :root {
        color-scheme: light dark;
        --bg: #f6f6f3;

        --ink: #1d2733;
        --muted: #5d6b7a;
        --line: #dfe3da;
        --accent: #0e7a5f;
        --accent-ink: #ffffff;
        --accent-soft: #e0f1ea;
        --word: #bc5509;
        --word-soft: #fbeedd;
        --bad: #b3261e;
        --bad-soft: #fbe9e7;
        --shadow: 0 1px 3px rgba(20, 35, 30, .08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10151b;
          --surface: #1a212b;
          --surface2: #232d3a;
          --ink: #e9edf2;

          --accent-ink: #0b2019;
          --accent-soft: #14332b;

          --word-soft: #3a2a18;
          --bad: #ff9d94;
          --bad-soft: #3d1f1c;
          --shadow: 0 1px 3px rgba(0, 0, 0, .4);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }

        margin: 0;
        background: var(--bg);
        color: var(--ink);

      button, input, textarea, select { font: inherit; color: inherit; }
      button, [role="button"], summary { min-height: 2.75rem; }
      .en { font-family: Georgia, "Times New Roman", "Songti SC", serif; }

      /* ---------- home ---------- */
      .home-head { padding: 8px 0 4px; }
      .home-head h1 { font-size: 26px; margin: 0 0 2px; letter-spacing: .5px; }
      .home-head p { margin: 0; color: var(--muted); font-size: 14px; }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 16px;
        margin-top: 14px;
      }
      .card h2 { font-size: 17px; margin: 0 0 8px; }
      .card h3 { font-size: 15px; margin: 14px 0 6px; }
      .muted { color: var(--muted); }
      .small { font-size: 13px; }
      .review-num { font-size: 30px; font-weight: 700; color: var(--accent); line-height: 1.1; }
      .review-item {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 0; border-top: 1px solid var(--line);
      }
      .review-item:first-of-type { border-top: none; }
      .review-item .grow { flex: 1; min-width: 0; }
      .ep-card { width: 100%; text-align: left; cursor: pointer; display: block; }
      .ep-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .ep-title { font-size: 18px; font-weight: 700; }
      .ep-theme { color: var(--muted); font-size: 14px; margin-top: 2px; }
      .badge {
        font-size: 12px; padding: 2px 8px; border-radius: 999px;
        background: var(--surface2); color: var(--muted); white-space: nowrap;
      }
      .badge.doing { background: var(--accent-soft); color: var(--accent); }
      .badge.done { background: var(--accent); color: var(--accent-ink); }
      .progress-track { height: 8px; border-radius: 999px; background: var(--surface2); margin-top: 12px; overflow: hidden; }
      .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
      .ep-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 13px; color: var(--muted); }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border: 1px solid var(--line); background: var(--surface); color: var(--ink);
        border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 15px;
        min-height: 44px; text-decoration: none;
      }
      .btn:active { transform: scale(.98); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
      .btn.ghost { background: transparent; }
      .btn.small-btn { min-height: 40px; padding: 4px 12px; font-size: 14px; }
      .btn.block { width: 100%; }
      .btn[disabled] { opacity: .45; pointer-events: none; }
      .btn.done-state { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
      ol.install { margin: 6px 0 0; padding-left: 20px; }
      ol.install li { margin: 4px 0; }
      details.card summary { cursor: pointer; font-weight: 600; font-size: 16px; list-style: none; min-height: 44px; display: flex; align-items: center; }
      details.card summary::-webkit-details-marker { display: none; }
      details.card summary::after { content: "＋"; margin-left: auto; color: var(--muted); }
      details.card[open ] summary::after { content: "－"; }
      .danger-zone { margin-top: 22px; text-align: center; }
      .link-btn { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; min-height: 36px; }
      .link-btn.armed { color: var(--bad); font-weight: 700; }

      /* ---------- episode ---------- */
      .ep-head { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: 10px 0 8px; margin: 0 -2px; }
      .ep-head-row { display: flex; align-items: center; gap: 10px; }
      .back-btn { flex: none; width: 44px; padding: 0; font-size: 20px; }
      .ep-head h1 { font-size: 18px; margin: 0; flex: 1; min-width: 0; }
      .ep-head .sub { font-size: 12px; color: var(--muted); }
      .step-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
      .step-cell {
        border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
        padding: 6px 2px; cursor: pointer; text-align: center; min-height: 52px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
      }
      .step-cell .n { font-size: 15px; font-weight: 700; line-height: 1.2; }
      .step-cell .t { font-size: 12px; color: var(--muted); line-height: 1.2; }
      .step-cell.active { border-color: var(--accent); background: var(--accent-soft); }
      .step-cell.active .t { color: var(--accent); }
      .step-cell.is-done .n::after { content: " ✓"; color: var(--accent); font-size: 13px; }
      .panel h2 { font-size: 19px; margin: 4px 0 4px; }
      .panel .lead { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
      audio { width: 100%; margin: 6px 0 4px; }
      .audio-note { font-size: 13px; color: var(--muted); margin: 2px 0 10px; }
      .choice {
        display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left;
        border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
        padding: 12px; margin-top: 8px; cursor: pointer; min-height: 48px;
      }
      .choice .mark { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); margin-top: 1px; }
      .choice.picked { border-color: var(--accent); }
      .choice.picked .mark { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--surface); }
      .choice.right { border-color: var(--accent); background: var(--accent-soft); }
      .choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
      textarea, input[type="text"] {
        width: 100%; border: 1px solid var(--line); border-radius: 10px;
        background: var(--surface); padding: 10px 12px; font-size: 16px;
      }
      textarea { min-height: 74px; resize: vertical; }
      textarea:focus, input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
      .feedback { margin-top: 10px; font-size: 14px; padding: 10px 12px; border-radius: 10px; display: none; }
      .feedback.show { display: block; }
      .feedback.ok { background: var(--accent-soft); color: var(--accent); }
      .feedback.no { background: var(--bad-soft); color: var(--bad); }

      /* sentences */
      .sent {
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        padding: 14px; margin-top: 12px; box-shadow: var(--shadow);
      }
      .sent-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .ts { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; background: var(--surface2); border-radius: 6px; padding: 2px 7px; }
      .sent-num { font-size: 12px; color: var(--muted); }
      .sent .en { font-size: 18px; line-height: 1.5; }
      .sent .zh { margin-top: 8px; font-size: 15px; }
      .sent .note { margin-top: 6px; font-size: 13.5px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
      .sent-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .mini-btn {
        border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
        padding: 4px 12px; font-size: 13.5px; cursor: pointer; min-height: 40px;
        display: inline-flex; align-items: center; gap: 5px;
      }
      .mini-btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
      .mini-btn.flag-on { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); font-weight: 600; }
      mark.chunk { background: var(--accent-soft); color: inherit; border-bottom: 2px solid var(--accent); border-radius: 3px; padding: 0 1px; }
      mark.word { background: var(--word-soft); color: inherit; border-bottom: 2px solid var(--word); border-radius: 3px; padding: 0 1px; }
      .legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin: 4px 0 2px; flex-wrap: wrap; }
      .legend .sw { display: inline-block; width: 14px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
      .sent-row {
        display: flex; gap: 10px; align-items: flex-start; width: 100%;
        background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
        padding: 12px; margin-top: 10px; text-align: left;
      }
      .sent-row .en { font-size: 16.5px; flex: 1; }
      .flag-tag { flex: none; font-size: 12px; border-radius: 999px; padding: 3px 9px; background: var(--surface2); color: var(--muted); margin-top: 2px; }
      .sent-row.flagged { border-color: var(--bad); }
      .sent-row.flagged .flag-tag { background: var(--bad-soft); color: var(--bad); font-weight: 700; }

      /* chunks & words */
      .chunk-card, .word-card {
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
        padding: 14px; margin-top: 12px; box-shadow: var(--shadow);
      }
      .chunk-card .en, .word-card .en { font-size: 19px; font-weight: 700; }
      .ipa { font-size: 15px; color: var(--word); margin-left: 8px; font-family: Georgia, serif; }
      .chunk-card p, .word-card p { margin: 6px 0 0; font-size: 14.5px; }
      .word-card .say { margin-top: 10px; }

      /* fill-in */
      .fill-q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; box-shadow: var(--shadow); }
      .fill-q .en { font-size: 17px; line-height: 1.6; }
      .fill-q .blank { display: inline-block; min-width: 74px; border-bottom: 2px solid var(--accent); }
      .fill-q input { margin-top: 10px; }
      .fill-q .hint-box { display: none; margin-top: 10px; font-size: 14px; background: var(--surface2); border-radius: 10px; padding: 10px 12px; }
      .fill-q .hint-box.show { display: block; }
      .fill-q .hint-box .lvl { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }
      .fill-q .verdict { margin-top: 8px; font-size: 14px; display: none; }
      .fill-q .verdict.show { display: block; }
      .verdict.ok { color: var(--accent); font-weight: 600; }
      .verdict.no { color: var(--bad); }
      .fill-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

      /* sentence making */
      .starter { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; box-shadow: var(--shadow); }
      .starter .en { font-size: 17px; line-height: 1.6; }
      .starter .idea { font-size: 14px; color: var(--muted); margin: 8px 0 10px; background: var(--surface2); border-radius: 10px; padding: 10px 12px; }

      /* shadow counter */
      .counter-row { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
      .counter-num { font-size: 34px; font-weight: 700; color: var(--accent); min-width: 52px; text-align: center; }
      .seg-toggle { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 8px; }
      .seg-toggle button { flex: 1; border: none; background: var(--surface); cursor: pointer; padding: 8px; min-height: 44px; font-size: 15px; }
      .seg-toggle button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

      /* retell checklist */
      .check-item {
        display: flex; gap: 12px; align-items: center; background: var(--surface);
        border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px;
        cursor: pointer; min-height: 52px;
      }
      .check-item input { width: 22px; height: 22px; flex: none; accent-color: var(--accent); }
      .check-item .en { font-size: 17px; font-weight: 600; }
      .check-item .zh2 { font-size: 13px; color: var(--muted); }
      .schedule { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
      .schedule span { font-size: 13px; background: var(--surface2); border-radius: 999px; padding: 4px 10px; }
      .schedule span.done-off { background: var(--accent-soft); color: var(--accent); }

      .step-foot { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
      .nav-row { display: flex; gap: 10px; }
      .nav-row .btn { flex: 1; }
      .toast {
        position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
        background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px;
        opacity: 0; pointer-events: none; transition: all .25s; z-index: 50; max-width: 88vw; text-align: center;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      [hidden] { display: none !important; }
    </style>

    <div class="toast" id="toast"></div>

    <script>
      "use strict";

            { en: "at a certain point", zh: "到了某个点、到了一定阶段。引出「不得不面对现实」的转折。", ex: "At a certain point, you've got to realize you have to succeed." },
            { en: "any other way", zh: "以任何其他方式。aren't going to make it any other way = 别无他法。", ex: "You aren't going to make it any other way." }
          ],
          words: [
            { en: "obsessed", ipa: "/əbˈsest/", zh: "重音在第二音节，-ed 读 /t/ 不读 /d/。be obsessed with = 痴迷于、满脑子都是，比 like 强得多，带点「上头」。" },
            { en: "despite", ipa: "/dɪˈspaɪt/", zh: "重音在第二音节，结尾 /aɪt/ 收得清脆。= 尽管；后面直接接名词或从句，不加 of（in spite of 才有 of，这是最常见的写错点）。" },
            { en: "luxury", ipa: "/ˈlʌɡʒəri/", zh: "重音在第一音节，中间是 /ɡʒ/ 的浊音团，别读成「拉克瑟瑞」。= 奢侈、难得的条件；have the luxury of doing = 有条件做某事。" },
            { en: "inflation", ipa: "/ɪnˈfleɪʃn/", zh: "重音在第二音节，-tion 读 /ʃn/，几乎不带元音。= 通货膨胀；keep up with inflation = 跟上通胀。" },
            { en: "debt", ipa: "/det/", zh: "b 不发音！直接读 /det/。= 债务；student debt 学贷，pay off your debt 还清债。" }
          ],
          fills: [
            { before: "The reason why Gen Z is so obsessed with ", after: " is because we have to.", answer: "locking in", zh: "Z 世代这么着迷于全力冲刺，是因为他们不得不。" },
            { before: "We ", after: " just going to college and not really caring about anything.", answer: "don't have the luxury of", zh: "我们没那个条件只管上大学、什么都不操心。" },
            { before: "The system doesn't work anymore, so it is ", after: ".", answer: "do or die", zh: "系统不灵了，所以只能背水一战。" },
            { before: "But ", after: ", you've got to realize you have to succeed.", answer: "at a certain point", zh: "但到了某个点，你必须意识到你得成功。" },
            { before: "You have to ", after: " in this economy, in this modern world.", answer: "make it", zh: "你必须在这个经济环境里混出头。" },
            { before: "And so you have to ", after: ", because you aren't going to make it any other way.", answer: "lock in", zh: "所以你必须全力冲，因为你没有别的路能成。" },
            { before: "You aren't going to make it ", after: ".", answer: "any other way", zh: "你用别的方法是成不了的。" },
            { before: "Because ", after: " things were different and things were fair, they just aren't.", answer: "despite how much I wish", zh: "因为尽管我多么希望事情不一样、世界是公平的，它们就是不是。" }
          ],
          starters: [
            { text: "I don't have the luxury of ______, I have to ______.",
              idea: "灵感：第一个空写你现在没条件做的事（慢慢找工作 / 休息一年 / 只做喜欢的事）；第二个空写你眼下必须做的事（先赚钱 / 把英语练到能用 / 把账号做起来）。" },
            { text: "In this economy, I have to make it — to have the freedom to ______.",
              idea: "灵感：空里写你想要的自由具体长什么样（想走就走地去旅居 / 自己定工作时间 / 不用为房租发愁）。" },
            { text: "Despite how much I wish ______, I still have to lock in and ______.",
              idea: "灵感：第一个空写你希望世界是什么样（房价低一点 / 努力就有回报 / 路好走一点）；第二个空写你打算实打实做的动作（每天练口语 / 学 AI 工作流 / 投简历）。" }
          ],
          retellChunks: [
            { en: "lock in", zh: "锁死状态，全力冲" },
            { en: "do or die", zh: "背水一战" },
            { en: "any other way", zh: "别无他法" }
          ]
        }
      ];

      var STEP_NAMES = ["盲听", "字幕", "精听", "词块", "填空", "造句", "跟读", "复述"];
      var REVIEW_OFFSETS = [1, 3, 7, 14, 30];
      var REVIEW_DAILY_CAP = 5;
      var LS_KEY = "shipin-jingxue-v1";
      var SLOW_FACTOR = 87 / 66; /* 0.75 倍速文件 87 秒 ↔ 原速 66 秒 */

      /* ---------------- state ---------------- */
      function blankEpState() {
        return {
          steps: {}, flagged: [], read: [], zhOpen: [],
          gistChoice: -1, gistChecked: false, gistText: "",
          fillAnswers: {}, fillHints: {}, fillResults: null,
          drafts: {}, shadowCount: 0, shadowRate: "slow",
          retell: {}, completedDate: null, reviewsDone: []
        };
      }
      function loadState() {
        try {
          var raw = localStorage.getItem(LS_KEY);
          if (raw) { var s = JSON.parse(raw); if (s && s.eps) return s; }
        } catch (e) {}
        return { eps: {} };
      }
      var state = loadState();
      function epState(id) {
        if (!state.eps[id]) state.eps[id] = blankEpState();
        var s = state.eps[id], b = blankEpState();
        for (var k in b) if (s[k] === undefined) s[k] = b[k];
        return s;
      }
      function save() {
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      }
      var ui = { epId: null, step: 1 };

      /* ---------------- helpers ---------------- */
      function $(id) { return document.getElementById(id); }
      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function todayStr(d) {
        d = d || new Date();
        var m = String(d.getMonth() + 1); if (m.length < 2) m = "0" + m;
        var day = String(d.getDate()); if (day.length < 2) day = "0" + day;
        return d.getFullYear() + "-" + m + "-" + day;
      }
      function addDays(dateStr, n) {
        var p = dateStr.split("-");
        var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        d.setDate(d.getDate() + n);
        return todayStr(d);
      }
      function norm(s) {
        return String(s || "").toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9' ]/g, " ").replace(/\s+/g, " ").trim();
      }
      var toastTimer = null;
      function toast(msg) {
        var t = $("toast"); t.textContent = msg; t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
      }
      function speak(text) {
        try {
          if (!("speechSynthesis" in window)) { toast("这台设备不支持点读朗读"); return; }
          window.speechSynthesis.cancel();
          var u = new SpeechSynthesisUtterance(text);
          u.lang = "en-US"; u.rate = 0.88;
          window.speechSynthesis.speak(u);
        } catch (e) { toast("朗读失败，换个浏览器试试"); }
      }
      function sentText(s) {
        return s.parts.map(function (p) { return p[0]; }).join("");
      }
      function sentHTML(s) {
        return s.parts.map(function (p) {
          if (p[1] === "c") return '<mark class="chunk">' + esc(p[0]) + "</mark>";
          if (p[1] === "w") return '<mark class="word">' + esc(p[0]) + "</mark>";
          return esc(p[0]);
        }).join("");
      }
      function currentEp() {
        for (var i = 0; i < EPISODES.length; i++) if (EPISODES[i].id === ui.epId) return EPISODES[i];
        return EPISODES[0];
      }

      /* segment playback from the slow file (original-speed timestamps × SLOW_FACTOR) */
      var segAudio = new Audio();
      var segTimer = null;
      function playSegment(start, end) {
        segAudio.src = currentEp().audio;
        segAudio.playbackRate = 1;
        var go = function () {
          segAudio.currentTime = start * SLOW_FACTOR;
          segAudio.play();
          clearTimeout(segTimer);
          segTimer = setTimeout(function () { segAudio.pause(); }, (end - start) * SLOW_FACTOR * 1000 + 350);
        };
        if (segAudio.readyState >= 1) go();
        else segAudio.addEventListener("loadedmetadata", go, { once: true });
      }

      /* ---------------- review engine ---------------- */
      function dueReviews() {
        var today = todayStr(), out = [];
        EPISODES.forEach(function (ep) {
          var st = epState(ep.id);
          if (!st.completedDate) return;
          REVIEW_OFFSETS.forEach(function (off) {
            if (st.reviewsDone.indexOf(off) >= 0) return;
            var due = addDays(st.completedDate, off);
            if (due <= today) out.push({ ep: ep, offset: off, due: due });
          });
        });
        out.sort(function (a, b) { return a.due < b.due ? -1 : 1; });
        return out;
      }
      function nextReviewInfo(ep) {
        var st = epState(ep.id);
        if (!st.completedDate) return null;
        for (var i = 0; i < REVIEW_OFFSETS.length; i++) {
          var off = REVIEW_OFFSETS[i];
          if (st.reviewsDone.indexOf(off) >= 0) continue;
          var due = addDays(st.completedDate, off);
          return { offset: off, due: due, overdue: due <= todayStr() };
        }
        return { allDone: true };
      }

      /* ---------------- home ---------------- */
      function stepsDoneCount(st) {
        var n = 0; for (var i = 1; i <= 8; i++) if (st.steps[i]) n++;
        return n;
      }
      function renderHome() {
        /* reviews */
        var due = dueReviews();
        var rb = $("review-body");
        if (!due.length) {
          var anyDone = EPISODES.some(function (ep) { return !!epState(ep.id).completedDate; });
          rb.innerHTML = anyDone
            ? '<p class="muted" style="margin:0">今天没有到期的复习。下一轮复习日到了会自动出现在这里。</p>'
            : '<p class="muted" style="margin:0">还没有完成的集数。走完一集的第 8 步后，这里会按 +1 / +3 / +7 / +14 / +30 天排出复习提醒。</p>';
        } else {
          var show = due.slice(0, REVIEW_DAILY_CAP);
          var html = '<div class="review-num">' + due.length + ' <span style="font-size:15px;font-weight:400" class="muted">项到期</span></div>';
          if (due.length > REVIEW_DAILY_CAP) {
            html += '<p class="small muted" style="margin:4px 0 0">今天先清最要紧的 ' + REVIEW_DAILY_CAP + ' 项就好，剩下的 ' + (due.length - REVIEW_DAILY_CAP) + ' 项顺延，别让队列压垮自己。</p>';
          }
          show.forEach(function (r, idx) {
            html += '<div class="review-item"><div class="grow"><div><strong>第 ' + r.ep.no + ' 集 · ' + esc(r.ep.title) + '</strong></div>' +
              '<div class="small muted">第 ' + r.offset + ' 天复习 · 应于 ' + r.due + ' 完成</div></div>' +
              '<button class="btn small-btn primary" type="button" data-review="' + r.ep.id + ":" + r.offset + '">复习完了</button></div>';
          });
          rb.innerHTML = html;
          rb.querySelectorAll("[data-review]").forEach(function (btn) {
            btn.addEventListener("click", function () {
              var parts = btn.getAttribute("data-review").split(":");
              var st = epState(parts[0]);
              st.reviewsDone.push(Number(parts[1]));
              save(); renderHome(); toast("已记下，这轮复习完成 ✓");
            });
          });
        }
        /* episodes */
        var list = $("ep-list");
        var html2 = "";
        EPISODES.forEach(function (ep) {
          var st = epState(ep.id);
          var done = stepsDoneCount(st);
          var pct = Math.round(done / 8 * 100);
          var badge, bcls;
          if (st.completedDate) { badge = "已完成"; bcls = "done"; }
          else if (done > 0) { badge = "学到第 " + done + " 步"; bcls = "doing"; }
          else { badge = "未开始"; bcls = ""; }
          var meta = "";
          if (st.fillResults) meta += "<span>填空 " + st.fillResults.right + "/" + st.fillResults.total + "</span>";
          if (st.shadowCount) meta += "<span>跟读 " + st.shadowCount + " 遍</span>";
          var nr = nextReviewInfo(ep);
          if (nr && !nr.allDone) meta += "<span>下次复习 " + nr.due + (nr.overdue ? "（已到期）" : "") + "</span>";
          if (nr && nr.allDone) meta += "<span>五轮复习已全部完成</span>";
          html2 += '<button class="card ep-card" type="button" data-open="' + ep.id + '">' +
            '<span class="ep-top"><span class="ep-title">第 ' + ep.no + ' 集 · ' + esc(ep.title) + '</span><span class="badge ' + bcls + '">' + badge + "</span></span>" +
            '<span class="ep-theme">' + esc(ep.theme) + "</span>" +
            '<span class="ep-theme" style="display:block;font-size:12px">' + esc(ep.source) + "</span>" +
            '<span class="progress-track" style="display:block"><span class="progress-fill" style="display:block;width:' + pct + '%"></span></span>' +
            (meta ? '<span class="ep-meta">' + meta + "</span>" : "") +
            "</button>";
        });
        list.innerHTML = html2;
        list.querySelectorAll("[data-open]").forEach(function (btn) {
          btn.addEventListener("click", function () { openEp(btn.getAttribute("data-open")); });
        });
      }

      /* ---------------- episode shell ---------------- */
      function openEp(id) {
        ui.epId = id;
        var st = epState(id);
        ui.step = 1;
        for (var i = 1; i <= 8; i++) { if (!st.steps[i]) { ui.step = i; break; } ui.step = 8; }
        $("view-home").hidden = true;
        $("view-ep").hidden = false;
        renderEp();
        window.scrollTo(0, 0);
      }
      function closeEp() {
        try { segAudio.pause(); } catch (e) {}
        if ("speechSynthesis" in window) try { window.speechSynthesis.cancel(); } catch (e) {}
        $("view-ep").hidden = true;
        $("view-home").hidden = false;
        renderHome();
        window.scrollTo(0, 0);
      }
      function renderEp() {
        var ep = currentEp(), st = epState(ep.id);
        $("ep-head-title").textContent = "第 " + ep.no + " 集 · " + ep.title;
        $("ep-head-sub").textContent = "已完成 " + stepsDoneCount(st) + " / 8 步";
        var grid = $("step-grid"), html = "";
        STEP_NAMES.forEach(function (name, i) {
          var n = i + 1;
          html += '<button type="button" class="step-cell' + (ui.step === n ? " active" : "") + (st.steps[n] ? " is-done" : "") + '" data-step="' + n + '">' +
            '<span class="n">' + n + '</span><span class="t">' + name + "</span></button>";
        });
        grid.innerHTML = html;
        grid.querySelectorAll("[data-step]").forEach(function (b) {
          b.addEventListener("click", function () { ui.step = Number(b.getAttribute("data-step")); renderEp(); window.scrollTo(0, 0); });
        });
        renderPanel();
      }
      function stepFoot(ep, st, n) {
        var done = !!st.steps[n];
        var html = '<div class="step-foot">' +
          '<button class="btn block ' + (done ? "done-state" : "primary") + '" type="button" id="step-done-btn">' + (done ? "✓ 这一步已完成（点此取消）" : "完成这一步") + "</button>" +
          '<div class="nav-row">' +
          (n > 1 ? '<button class="btn" type="button" id="prev-btn">‹ 上一步</button>' : "") +
          (n < 8 ? '<button class="btn" type="button" id="next-btn">下一步 ›</button>' : "") +
          "</div></div>";
        return html;
      }
      function bindStepFoot(n) {
        var ep = currentEp(), st = epState(ep.id);
        var d = $("step-done-btn");
        if (d) d.addEventListener("click", function () {
          st.steps[n] = !st.steps[n];
          if (n === 8) {
            if (st.steps[8] && !st.completedDate) {
              st.completedDate = todayStr();
              toast("本集完成！复习排程已生成：+" + REVIEW_OFFSETS.join(" / +") + " 天");
            }
            if (!st.steps[8]) st.completedDate = null;
          }
          save(); renderEp();
        });
        var p = $("prev-btn"); if (p) p.addEventListener("click", function () { ui.step = n - 1; renderEp(); window.scrollTo(0, 0); });
        var x = $("next-btn"); if (x) x.addEventListener("click", function () { ui.step = n + 1; renderEp(); window.scrollTo(0, 0); });
      }

      /* ---------------- panels ---------------- */
      function renderPanel() {
        var ep = currentEp(), st = epState(ep.id), n = ui.step, panel = $("panel"), html = "";
        if (n === 1) {
          html = '<div class="panel"><h2>第 1 步 · 盲听抓大意</h2>' +
            '<p class="lead">字幕全藏。先听一遍，只抓大意——听不懂细节完全正常，这一步就是摸个轮廓。</p>' +
            "<audio controls preload=\"metadata\" id=\"gist-audio\" src=\"" + ep.audio + '"></audio>' +
            '<p class="audio-note">这段是原速播放（文件本身是 0.75 倍速录的，这里加速还原）。</p>' +
            "<h3>" + esc(ep.gistQuestion) + "</h3>";
          ep.gistOptions.forEach(function (opt, i) {
            var cls = "choice";
            if (st.gistChecked) {
              if (i === ep.gistAnswer) cls += " right";
              else if (i === st.gistChoice) cls += " wrong";
            } else if (i === st.gistChoice) cls += " picked";
            html += '<button type="button" class="' + cls + '" data-gist="' + i + '"><span class="mark"></span><span>' + esc(opt) + "</span></button>";
          });
          html += '<div class="feedback" id="gist-feedback"></div>' +
            '<h3 style="margin-top:16px">用中文写一句你听懂的大意</h3>' +
            '<textarea id="gist-text" placeholder="比如：他说现在年轻人没得选，只能拼命……"></textarea>' +
            stepFoot(ep, st, 1) + "</div>";
          panel.innerHTML = html;
          var ga = $("gist-audio");
          var setRate = function () { try { ga.playbackRate = SLOW_FACTOR; } catch (e) {} };
          ga.addEventListener("loadedmetadata", setRate); setRate();
          panel.querySelectorAll("[data-gist]").forEach(function (b) {
            b.addEventListener("click", function () {
              st.gistChoice = Number(b.getAttribute("data-gist"));
              st.gistChecked = true; save(); renderPanel();
            });
          });
          var fb = $("gist-feedback");
          if (st.gistChecked) {
            fb.classList.add("show");
            if (st.gistChoice === ep.gistAnswer) { fb.classList.add("ok"); fb.textContent = "对了。这段的核心就一句：旧路太贵，只能 lock in 换自由。"; }
            else { fb.classList.add("no"); fb.textContent = "不太对。再想想他反复说的 lock in 和钱——正确答案已用绿色标出。"; }
          }
          var gt = $("gist-text");
          gt.value = st.gistText || "";
          gt.addEventListener("input", function () { st.gistText = gt.value; save(); });
        }
        else if (n === 2) {
          var flaggedCount = st.flagged.length;
          html = '<div class="panel"><h2>第 2 步 · 英文字幕听，标难点</h2>' +
            '<p class="lead">看着英文再听一遍（第 1 步的播放器速度即可，也可回第 7 步用慢速）。哪句听不懂、跟不上，点一下标成难点——第 3 步重点攻它们。这一步只有英文，没有中文。</p>' +
            '<p class="small muted">已标难点：<strong id="flag-count">' + flaggedCount + "</strong> / " + ep.sentences.length + " 句</p>";
          ep.sentences.forEach(function (s, i) {
            var fl = st.flagged.indexOf(i) >= 0;
            html += '<div class="sent-row' + (fl ? " flagged" : "") + '" data-flag="' + i + '"><span class="en">' + esc(sentText(s)) + '</span><span class="flag-tag">' + (fl ? "难点 ✓" : "标难点") + "</span></div>";
          });
          html += stepFoot(ep, st, 2) + "</div>";
          panel.innerHTML = html;
          panel.querySelectorAll("[data-flag]").forEach(function (row) {
            row.addEventListener("click", function () {
              var i = Number(row.getAttribute("data-flag"));
              var idx = st.flagged.indexOf(i);
              if (idx >= 0) st.flagged.splice(idx, 1); else st.flagged.push(i);
              save(); renderPanel();
            });
          });
        }
        else if (n === 3) {
          html = '<div class="panel"><h2>第 3 步 · 逐句精听</h2>' +
            '<p class="lead">一句一句抠：点「原声」听这一句的慢速原声，跟着读出声，读顺了标「已跟读」。中文翻译默认收起，想看点卡片上的「中文」。</p>' +
            '<div class="legend"><span><span class="sw" style="background:var(--accent)"></span>词块（整组记）</span><span><span class="sw" style="background:var(--word)"></span>重点词（看第 4 步）</span></div>';
          ep.sentences.forEach(function (s, i) {
            var isRead = st.read.indexOf(i) >= 0;
            var zhOpen = st.zhOpen.indexOf(i) >= 0;
            var fl = st.flagged.indexOf(i) >= 0;
            html += '<div class="sent"><div class="sent-head"><span class="ts">' + s.t + '</span><span class="sent-num">第 ' + (i + 1) + " 句" + (fl ? ' · <span style="color:var(--bad);font-weight:700">你标的难点</span>' : "") + '</span></div>' +
              '<div class="en">' + sentHTML(s) + "</div>" +
              (zhOpen ? '<div class="zh">' + esc(s.zh) + "</div>" : "") +
              '<div class="note">' + esc(s.note) + "</div>" +
              '<div class="sent-actions">' +
              '<button type="button" class="mini-btn" data-play="' + i + '">▶ 原声</button>' +
              '<button type="button" class="mini-btn" data-tts="' + i + '">点读</button>' +
              '<button type="button" class="mini-btn' + (zhOpen ? " on" : "") + '" data-zh="' + i + '">中文</button>' +
              '<button type="button" class="mini-btn' + (isRead ? " on" : "") + '" data-read="' + i + '">' + (isRead ? "✓ 已跟读" : "标已跟读") + "</button>" +
              "</div></div>";
          });
          html += stepFoot(ep, st, 3) + "</div>";
          panel.innerHTML = html;
          panel.querySelectorAll("[data-play]").forEach(function (b) {
            b.addEventListener("click", function () { var s = ep.sentences[Number(b.getAttribute("data-play"))]; playSegment(s.start, s.end); });
          });
          panel.querySelectorAll("[data-tts]").forEach(function (b) {
            b.addEventListener("click", function () { speak(sentText(ep.sentences[Number(b.getAttribute("data-tts"))])); });
          });
          panel.querySelectorAll("[data-zh]").forEach(function (b) {
            b.addEventListener("click", function () {
              var i = Number(b.getAttribute("data-zh")), idx = st.zhOpen.indexOf(i);
              if (idx >= 0) st.zhOpen.splice(idx, 1); else st.zhOpen.push(i);
              save(); renderPanel();
            });
          });
          panel.querySelectorAll("[data-read]").forEach(function (b) {
            b.addEventListener("click", function () {
              var i = Number(b.getAttribute("data-read")), idx = st.read.indexOf(i);
              if (idx >= 0) st.read.splice(idx, 1); else st.read.push(i);
              save();
              $("ep-head-sub").textContent = "已完成 " + stepsDoneCount(st) + " / 8 步";
              renderPanel();
            });
          });
        }
        else if (n === 4) {
          html = '<div class="panel"><h2>第 4 步 · 学词块与重点词</h2>' +
            '<p class="lead">本集只焊死 6 个词块 + 5 个重点词，多了记不住。词块整组记，重点词注意发音和那个最容易错的点。点词卡上的按钮可以听发音。</p>' +
            "<h3>词块（6）</h3>";
          ep.chunks.forEach(function (c) {
            html += '<div class="chunk-card"><span class="en">' + esc(c.en) + '</span><p>' + esc(c.zh) + '</p><p class="en" style="font-size:15.5px;color:var(--muted)">' + esc(c.ex) + '</p>' +
              '<div class="sent-actions"><button type="button" class="mini-btn" data-say="' + esc(c.en) + '">▶ 读词块</button><button type="button" class="mini-btn" data-say="' + esc(c.ex) + '">▶ 读原句</button></div></div>';
          });
          html += "<h3>重点词（5）</h3>";
          ep.words.forEach(function (w) {
            html += '<div class="word-card"><span class="en">' + esc(w.en) + '</span><span class="ipa">' + esc(w.ipa) + "</span><p>" + esc(w.zh) + "</p>" +
              '<div class="sent-actions"><button type="button" class="mini-btn" data-say="' + esc(w.en) + '">▶ 读这个词</button></div></div>';
          });
          html += stepFoot(ep, st, 4) + "</div>";
          panel.innerHTML = html;
          panel.querySelectorAll("[data-say]").forEach(function (b) {
            b.addEventListener("click", function () { speak(b.getAttribute("data-say")); });
          });
        }
        else if (n === 5) {
          html = '<div class="panel"><h2>第 5 步 · 填空自测</h2>' +
            '<p class="lead">8 道题，挖的全是词块。卡住别硬憋，点「给我提示」：一级给首字母和词数，二级给整句中文，三级直接给原句——用提示不丢人，硬猜才浪费时间。</p>';
          if (st.fillResults) {
            html += '<p class="small" style="background:var(--accent-soft);border-radius:10px;padding:10px 12px">上次成绩：<strong>' + st.fillResults.right + " / " + st.fillResults.total + "</strong>。改答案后可以重新检查。</p>";
          }
          ep.fills.forEach(function (f, i) {
            var res = st.fillResults && st.fillResults.detail ? st.fillResults.detail[i] : null;
            html += '<div class="fill-q"><div class="en">' + esc(f.before) + '<span class="blank">&nbsp;</span>' + esc(f.after) + "</div>" +
              '<input type="text" id="fill-' + i + '" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="把词块填在这里">' +
              '<div class="hint-box" id="hint-' + i + '"></div>' +
              '<div class="verdict" id="verdict-' + i + '"></div>' +
              '<div class="fill-actions"><button type="button" class="mini-btn" data-hint="' + i + '">给我提示</button></div></div>';
          });
          html += '<div style="margin-top:14px"><button class="btn primary block" type="button" id="fill-check">检查答案</button></div>' +
            '<div class="feedback" id="fill-feedback"></div>' + stepFoot(ep, st, 5) + "</div>";
          panel.innerHTML = html;
          ep.fills.forEach(function (f, i) {
            var inp = $("fill-" + i);
            inp.value = st.fillAnswers[i] || "";
            inp.addEventListener("input", function () { st.fillAnswers[i] = inp.value; save(); });
            renderHint(i);
            renderVerdict(i);
          });
          panel.querySelectorAll("[data-hint]").forEach(function (b) {
            b.addEventListener("click", function () {
              var i = Number(b.getAttribute("data-hint"));
              st.fillHints[i] = Math.min(3, (st.fillHints[i] || 0) + 1);
              save(); renderHint(i);
            });
          });
          $("fill-check").addEventListener("click", function () {
            var right = 0, detail = [];
            ep.fills.forEach(function (f, i) {
              var ok = norm(st.fillAnswers[i]) === norm(f.answer);
              detail[i] = ok;
              if (ok) right++;
            });
            st.fillResults = { right: right, total: ep.fills.length, detail: detail };
            save();
            ep.fills.forEach(function (f, i) { renderVerdict(i); });
            var fb = $("fill-feedback");
            fb.classList.add("show");
            fb.classList.toggle("ok", right === ep.fills.length);
            fb.classList.toggle("no", right !== ep.fills.length);
            fb.textContent = right === ep.fills.length
              ? "全对！这 6 个词块算是焊死了，去第 6 步用它们造句。"
              : "对了 " + right + " / " + ep.fills.length + "。错的题看看答案，对着原句再读两遍，然后改对再检查一次。";
            toast("填空成绩：" + right + " / " + ep.fills.length);
          });
          function renderHint(i) {
            var lvl = st.fillHints[i] || 0, box = $("hint-" + i);
            if (!box) return;
            if (!lvl) { box.classList.remove("show"); box.innerHTML = ""; return; }
            var f = ep.fills[i];
            var words = f.answer.split(" ").length;
            var h = "";
            if (lvl >= 1) h += '<span class="lvl">提示 1 · 首字母与词数</span>' + esc(f.answer.charAt(0)) + " 开头 · 共 " + words + " 个词";
            if (lvl >= 2) h += '<span class="lvl" style="margin-top:8px">提示 2 · 整句中文</span>' + esc(f.zh);
            if (lvl >= 3) h += '<span class="lvl" style="margin-top:8px">提示 3 · 原句</span><span class="en">' + esc(f.before + f.answer + f.after) + "</span>";
            box.innerHTML = h; box.classList.add("show");
          }
          function renderVerdict(i) {
            var v = $("verdict-" + i);
            if (!v || !st.fillResults || !st.fillResults.detail) return;
            var ok = st.fillResults.detail[i], f = ep.fills[i];
            v.classList.add("show");
            v.className = "verdict show " + (ok ? "ok" : "no");
            v.innerHTML = ok ? "✓ 对了" : "✗ 答案：<span class=\"en\">" + esc(f.answer) + "</span>";
          }
        }
        else if (n === 6) {
          html = '<div class="panel"><h2>第 6 步 · 造句</h2>' +
            '<p class="lead">用本集的骨架句式写你自己的话。每个空写什么，卡片里给了中文灵感——你负责用英文组出来。草稿自动存本地，写完发给 Colden 纠错（单词和语法都纠）。</p>';
          ep.starters.forEach(function (s, i) {
            html += '<div class="starter"><div class="en">' + esc(s.text) + '</div><div class="idea">' + esc(s.idea) + "</div>" +
              '<textarea id="draft-' + i + '" placeholder="在这里写出你的完整句子……"></textarea></div>';
          });
          html += '<p class="small muted" style="margin-top:12px">写完三句，截图或复制发给 Colden，说一句「帮我纠造句」，他会逐句给你改。</p>' +
            stepFoot(ep, st, 6) + "</div>";
          panel.innerHTML = html;
          ep.starters.forEach(function (s, i) {
            var ta = $("draft-" + i);
            ta.value = st.drafts[i] || "";
            ta.addEventListener("input", function () { st.drafts[i] = ta.value; save(); });
          });
        }
        else if (n === 7) {
          html = '<div class="panel"><h2>第 7 步 · 分阶段跟读</h2>' +
            '<p class="lead">真正的 shadowing 是「慢半拍同步跟读」：他说上半句，你跟着说下半句，不要停下来等播完。顺序：先 0.75 倍速跟顺，再切原速。最多跟 6 遍就停，转去复述——刷遍数没用。</p>' +
            '<div class="seg-toggle" role="group" aria-label="速度切换">' +
            '<button type="button" id="rate-slow" class="' + (st.shadowRate !== "orig" ? "on" : "") + '">0.75 倍速（先跟这个）</button>' +
            '<button type="button" id="rate-orig" class="' + (st.shadowRate === "orig" ? "on" : "") + '">原速（跟顺了再切）</button></div>' +
            '<audio controls preload="metadata" id="shadow-audio" src="' + ep.audio + '"></audio>' +
            '<p class="audio-note">' + esc(ep.audioNote) + "。切到「原速」是把这段音频加速还原，不是另一个文件。</p>" +
            '<div class="counter-row"><div><div class="small muted">已跟读</div><div class="counter-num" id="shadow-num">' + st.shadowCount + '</div></div>' +
            '<div style="flex:1"><button class="btn primary block" type="button" id="shadow-plus">跟完一遍，+1</button>' +
            '<button class="btn ghost block small-btn" type="button" id="shadow-minus" style="margin-top:6px">点错了，−1</button></div></div>' +
            '<div class="feedback" id="shadow-feedback"></div>' +
            stepFoot(ep, st, 7) + "</div>";
          panel.innerHTML = html;
          var sa = $("shadow-audio");
          var applyRate = function () { try { sa.playbackRate = st.shadowRate === "orig" ? SLOW_FACTOR : 1; } catch (e) {} };
          sa.addEventListener("loadedmetadata", applyRate); applyRate();
          $("rate-slow").addEventListener("click", function () { st.shadowRate = "slow"; save(); renderPanel(); });
          $("rate-orig").addEventListener("click", function () { st.shadowRate = "orig"; save(); renderPanel(); });
          var updFb = function () {
            var fb = $("shadow-feedback");
            if (st.shadowCount >= 6) {
              fb.classList.add("show"); fb.classList.add("ok");
              fb.textContent = "已经跟满 6 遍了，停。研究里跟读超过这个量收益就平了——去第 8 步脱稿复述，那才是把句子变成你自己的。";
            } else if (st.shadowCount >= 3) {
              fb.classList.add("show"); fb.classList.add("ok");
              fb.textContent = "3 遍了，手感应该有了。可以切原速再跟，或者直接去复述。";
            } else { fb.classList.remove("show"); }
          };
          updFb();
          $("shadow-plus").addEventListener("click", function () {
            st.shadowCount = Math.min(99, st.shadowCount + 1); save();
            $("shadow-num").textContent = st.shadowCount; updFb();
          });
          $("shadow-minus").addEventListener("click", function () {
            st.shadowCount = Math.max(0, st.shadowCount - 1); save();
            $("shadow-num").textContent = st.shadowCount; updFb();
          });
        }
        else if (n === 8) {
          html = '<div class="panel"><h2>第 8 步 · 脱稿复述</h2>' +
            '<p class="lead">关掉文本，用你自己的话把这段的意思讲 30 秒——讲你自己的处境也行。下面三个词块必须都用上，用上一个勾一个。</p>';
          ep.retellChunks.forEach(function (c, i) {
            var on = !!st.retell[c.en];
            html += '<label class="check-item"><input type="checkbox" data-retell="' + esc(c.en) + '"' + (on ? " checked" : "") + '><span><span class="en">' + esc(c.en) + '</span><br><span class="zh2">' + esc(c.zh) + "</span></span></label>";
          });
          html += '<div class="card" style="margin-top:16px"><h2 style="font-size:16px">录音交纠错</h2>' +
            '<p class="small muted" style="margin:0">用手机录音机录 30 秒复述，发给 Colden，他会逐句纠你的单词和语法。录之前可以最后看一眼第 3 步的逐句卡，录的时候别看。</p></div>';
          if (st.completedDate) {
            html += '<div class="card" style="margin-top:12px"><h2 style="font-size:16px">本集已完成 · ' + st.completedDate + '</h2>' +
              '<p class="small muted" style="margin:0 0 6px">复习排程（完成日 +N 天）：</p><div class="schedule">' +
              REVIEW_OFFSETS.map(function (off) {
                var doneR = st.reviewsDone.indexOf(off) >= 0;
                return "<span class=\"" + (doneR ? "done-off" : "") + '">' + addDays(st.completedDate, off) + "（+" + off + " 天）" + (doneR ? " ✓" : "") + "</span>";
              }).join("") + "</div>" +
              '<p class="small muted" style="margin:6px 0 0">到期的复习会出现在首页「今日复习」里，做完在那边点掉。</p></div>';
          }
          html += stepFoot(ep, st, 8) + "</div>";
          panel.innerHTML = html;
          panel.querySelectorAll("[data-retell]").forEach(function (cb) {
            cb.addEventListener("change", function () {
              st.retell[cb.getAttribute("data-retell")] = cb.checked; save();
            });
          });
        }
        bindStepFoot(n);
      }

      /* ---------------- boot ---------------- */
      $("back-btn").addEventListener("click", closeEp);
      var resetArmed = false, resetTimer = null;
      $("reset-btn").addEventListener("click", function () {
        if (!resetArmed) {
          resetArmed = true;
          this.textContent = "再点一次，确认清除全部进度";
          this.classList.add("armed");
          resetTimer = setTimeout(function () {
            resetArmed = false;
            var b = $("reset-btn"); b.textContent = "清除全部学习进度"; b.classList.remove("armed");
          }, 4000);
          return;
        }
        clearTimeout(resetTimer);
        state = { eps: {} }; save();
        resetArmed = false;
        this.textContent = "清除全部学习进度"; this.classList.remove("armed");
        renderHome(); toast("进度已清除");
      });
      EPISODES.forEach(function (ep) { epState(ep.id); });
      save();
      renderHome();
    </script>
  </body>
</html>
